<path d="M850 520 H915 V485 H940" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M175 560 V650 H915 V455 H940" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1055 510 V600" fill="none" stroke="#0369a1" stroke-width="2" marker-end="url(#arrow)"/>
<text x="187" y="198" font-size="13" fill="#475569">Initialise member scenario</text>
<text x="187" y="415" font-size="13" fill="#475569">Subsequent telemetry</text>
<text x="940" y="395" font-size="13" fill="#475569">Frozen requirements</text>
<text x="385" y="640" font-size="13" fill="#475569">Measured evidence</text>
<text x="65" y="590" font-size="13" fill="#475569">Operational state may change; scenario definitions and evaluation obligations remain fixed.</text>
<text x="940" y="559" font-size="13" fill="#475569">No scenario mutation</text>
<rect x="40" y="710" width="1130" height="73" rx="9" fill="#ffffff" stroke="#0369a1"/>
<text x="58" y="738" font-size="16">Research review and scenario-set revision belong to methodology; no automated outer loop is established.</text>
<text x="58" y="763" font-size="15" fill="#475569">Every claim names its frozen benchmark. Stabilisation and service satisfaction are assessed separately.</text>
<text x="40" y="812" font-size="13" fill="#475569">Decision modes: single expert · rule experts / blackboard · STRIPS / GPS / A* · local eco-agents</text>
</g></svg>
